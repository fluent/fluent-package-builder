name: Windows (ARM64)
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    timeout-minutes: 90
    runs-on: windows-11-arm
    steps:
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: 3.4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cache msi
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-msi
        with:
          path: fluent-package/msi/repositories
          key: ${{ runner.os }}-${{ runner.arch }}-cache-windows-${{ hashFiles('**/config.rb', '**/Rakefile', '**/Gemfile*', 'fluent-package/msi/assets/*', 'fluent-package/msi/source.wxs', 'fluent-package/msi/parameters.wxi.erb', 'fluent-package/msi/localization-en-us.wxl', 'fluent-package/msi/exclude-files.xslt', '.github/workflows/windows-arm.yml') }}
      - name: Install WiX Toolset
        if: ${{ ! steps.cache-msi.outputs.cache-hit }}
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wix314-binaries.zip"
          Invoke-WebRequest -Uri https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($hash -ne "6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31") {
            throw "Unexpected SHA256 of wix314-binaries.zip: $hash"
          }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\wix\bin"
          "WIX=$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build
        if: ${{ ! steps.cache-msi.outputs.cache-hit }}
        shell: pwsh
        working-directory: fluent-package
        run: |
          # The bundled Ruby in C:\opt\fluent cannot find MSYS2 installed by setup-ruby.
          $env:MSYS2_PATH = ruby -e "require 'ruby_installer/runtime'; puts RubyInstaller::Runtime.msys2_installation.msys_path"
          $env:FLUENT_PACKAGE_STAGING_PATH = "C:/opt/fluent"
          $env:FLUENT_PACKAGE_MSI_OUTPUT_PATH = "$PWD/msi/repositories"
          gem install bundler:2.7.2 --no-document
          rake msi:selfbuild
      - name: Upload msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-windows-arm64
          path: fluent-package/msi/repositories
  check_package_size:
    name: Check Package Size
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-windows-arm64
          path: fluent-package/msi/repositories
      - name: Check Package Size
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -Command ".\fluent-package\msi\pkgsize-test.ps1"
  test:
    name: Test ${{ matrix.test }}
    needs: build
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        test:
          - "install-test.ps1"
          - "install-test-with-install-path-including-space.ps1"
          - "update-from-v4-test.ps1"
          - "update-from-v4-test.ps1 -ViaV5"
          - "update-from-v5-test.ps1"
          - "serverspec-test.ps1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-windows-arm64
          path: fluent-package/msi/repositories
      - name: Installation Test
        shell: pwsh
        run: |
          # The test scripts expect the repository in C:\fluentd as in the Docker container for x86_64.
          New-Item -ItemType Junction -Path C:\fluentd -Target $PWD | Out-Null
          powershell -ExecutionPolicy Bypass -Command "C:\fluentd\fluent-package\msi\${{ matrix.test }}"
